name: Block 1.0 lockfile generator

on:
  push:
    branches:
      - block1-build-reproducibility
    paths:
      - package.json
      - .github/workflows/block1-lockfile.yml

permissions:
  contents: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: block1-build-reproducibility
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          registry-url: https://registry.npmjs.org

      - name: Verify pinned toolchain
        run: |
          test "$(node --version)" = "v24.20.0"
          test "$(npm --version)" = "11.19.0"

      - name: Generate lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify clean install and regression suite
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test

      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json already up to date"
            exit 0
          fi
          git commit -m "Block 1.0: add deterministic npm lockfile"
          git push origin HEAD:block1-build-reproducibility
